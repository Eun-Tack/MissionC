<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · MC</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root {
    --brand: oklch(58% 0.18 280);
    --bg: oklch(99% 0.005 270);
    --fg: oklch(20% 0.02 270);
    --muted: oklch(55% 0.015 270);
    --border: oklch(92% 0.01 270);
    --surface: oklch(98% 0.005 270);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(15% 0.01 270);
      --fg: oklch(94% 0.005 270);
      --muted: oklch(65% 0.015 270);
      --border: oklch(28% 0.015 270);
      --surface: oklch(20% 0.01 270);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard Variable', system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .card {
    width: min(380px, 92vw);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 24px 64px oklch(0% 0 0 / 0.1);
  }
  .logo {
    font-size: 32px; font-weight: 900; color: var(--brand);
    letter-spacing: -0.03em; margin-bottom: 8px;
  }
  .tagline {
    font-size: 13px; color: var(--muted); margin-bottom: 40px;
    line-height: 1.5;
  }
  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; padding: 14px 20px;
    background: white; color: #444;
    border: 1.5px solid #dadce0;
    border-radius: 12px;
    font-size: 15px; font-weight: 500;
    cursor: pointer; text-decoration: none;
    transition: box-shadow 120ms, border-color 120ms;
    font-family: inherit;
  }
  .google-btn:hover {
    box-shadow: 0 2px 12px oklch(0% 0 0 / 0.12);
    border-color: #bbb;
  }
  .google-icon { width: 20px; height: 20px; flex-shrink: 0; }
  .footer {
    margin-top: 32px; font-size: 11px; color: var(--muted); line-height: 1.6;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">MC</div>
  <div class="tagline">Mission Control<br>스케줄 · 프로젝트 · 메모가 하나로</div>

  <a href="/auth/login/google" class="google-btn">
    <svg class="google-icon" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Google 계정으로 로그인
  </a>

  <div class="footer">
    본인 계정만 접근 가능합니다.<br>
    다른 Google 계정은 자동으로 거부됩니다.
  </div>
</div>
</body>
</html>
